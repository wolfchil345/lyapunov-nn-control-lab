[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyapunov-nn-control-lab"
version = "1.0.1"
description = "A Lyapunov-aware neural network control lab for a mass-spring-damper system."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Sirichet Sriamontham" }
]
dependencies = [
  "control",
  "matplotlib",
  "numpy",
  "pytest",
  "scipy",
  "torch"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
