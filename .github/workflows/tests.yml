name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: test-python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable .[dev])
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pip check
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

  test:
    name: test
    runs-on: ubuntu-latest
    needs: test-python
    if: ${{ always() }}
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - name: Verify matrix result
        env:
          MATRIX_RESULT: ${{ needs.test-python.result }}
        run: |
          echo "test-python result: $MATRIX_RESULT"
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Python test matrix did not succeed."
            exit 1
          fi
          echo "All matrix entries succeeded."
