name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: test-python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable .[dev])
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pip check
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

  test:
    name: test
    runs-on: ubuntu-latest
    needs: test-python
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Aggregate matrix results and fail if any entry failed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request
          token=os.environ['GITHUB_TOKEN']
          repo=os.environ['REPO']
          run_id=os.environ['RUN_ID']
          url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs"
          req=urllib.request.Request(url, headers={'Authorization':f'token {token}', 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r:
              data=json.load(r)
          # consider jobs whose name starts with 'test-python'
          failures=[j for j in data.get('jobs', []) if j['name'].startswith('test-python') and j.get('conclusion')!='success']
          if failures:
              print('Matrix failures:')
              for f in failures:
                  print(f"- {f['name']}: {f.get('conclusion')}")
              sys.exit(1)
          print('All matrix entries succeeded')
          PY
