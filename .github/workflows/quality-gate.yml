name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    concurrency:
      group: quality-gate-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}

      - name: Install package (editable .[dev])
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pip check
        run: python -m pip check

      - name: Verify legacy artifact checksums
        run: python scripts/verify_legacy_checksums.py

      - name: Verify committed provenance-aware runs
        run: python scripts/verify_all_runs.py

      - name: Build sdist and wheel (no-isolation local check)
        run: python -m build --no-isolation

      - name: Build sdist and wheel (isolated build)
        run: python -m build

      - name: Run quality gate
        run: make quality-gate
