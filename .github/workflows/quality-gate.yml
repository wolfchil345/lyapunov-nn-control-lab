name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    concurrency:
      group: quality-gate-${{ github.ref }}
      cancel-in-progress: false

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable .[dev])
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pip check
        run: python -m pip check

      - name: Build sdist and wheel (no-isolation local check)
        run: python -m build --no-isolation

      - name: Build sdist and wheel (isolated build)
        run: python -m build

      - name: Run quality gate
        run: make quality-gate
